name: Rank Tracker

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run rank tracker
        env:
          GSC_CREDENTIALS: ${{ secrets.GSC_CREDENTIALS }}
          SHEET_ID:        ${{ secrets.SHEET_ID }}
          SITE_URL:        ${{ secrets.SITE_URL }}
          SERPAPI_KEY_1:     ${{ secrets.SERPAPI_KEY_1 }}
        run: python main.py

      - name: Commit history back to main
        run: |
          git config user.name  "rank-tracker-bot"
          git config user.email "bot@studyriserr.com"
          git config advice.addIgnoredFile false
          git add -f data/history.json
          git diff --staged --quiet && echo "No changes" || git commit -m "chore: update rank history $(date +'%Y-%m-%d')"
          git push origin main || echo "Nothing to push"

      - name: Deploy dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir:  ./dashboard
          publish_branch: gh-pages
          force_orphan: true